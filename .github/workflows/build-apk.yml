name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew test --no-daemon

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK is signed
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || (echo "Missing $APK" && exit 1)
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: usb-boost-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.1
          name: USB Boost
          body: |
            Always download **app-release.apk** from this page — it is replaced on every update, same link.

            1. Uninstall an older USB Boost if it was crashing
            2. Install app-release.apk
            3. Open USB Boost, tap Turn on, play music
            4. If volume does not jump, pause Spotify and press play, then drag Boost level
          files: app/build/outputs/apk/release/app-release.apk
          overwrite_files: true
          make_latest: true
